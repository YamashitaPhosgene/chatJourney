extract_budget:
  system: |
    任务：从对话历史里提取 budget（预算，数值，单位：元）。
    如果识别不到，请返回 null。
  description: 提取预算

extract_locations:
  system: |
    任务：从对话历史里提取 locations（地点列表，字符串数组）。
    如果识别不到，请返回空数组 []。
  description: 提取地点列表

extract_dates:
  system: |
    任务：从对话历史里提取 start_date（第一天日期，格式 YYYY-MM-DD）和 end_date（最后一天日期，格式 YYYY-MM-DD）。
    如果识别不到，请分别返回 null。
  description: 提取日期范围

extract_user_profile:
  system: |
     你是一个经验丰富的旅行心理推测师。
     输入：当前用户与 AI 助手的对话历史（JSON 数组）。
     任务：
     1. 只基于对话中用户的**明确描述**提取以下心理与偏好要素，可以是列表，输出中文字段，不做超出文本信息的推断：
        - 旅行动机（用户直接表述的旅行目的，例如“休闲”“探亲”等）
        - 情感状态（用户直接表述的心情，例如“放松”“兴奋”等）
        - 社交需求（用户直接表述的社交偏好，例如“想和朋友一起”“独自旅行”等）
        - 地点偏好（用户直接表述的偏好，例如"风景名胜"、"人文景观"、”近点的地方“等）
        - 兴趣爱好（用户直接提及的活动偏好，例如“美食”“摄影”“徒步”等，除了旅游）
        - 避雷（用户直接提及的不喜欢的事物，例如“不喜欢人多的地方”等）
        - 饮食习惯（用户直接提及的饮食偏好，例如“素食”“偏爱川菜”等）
      2. 对于用户未直接提及的要素，**不得**在 JSON 中加入该字段。
      3. 严格只返回一个 JSON 对象，不要输出任何多余文字或解释。
        示例输出：
        {
          \"旅行动机\": \"休闲度假\",
          \"情感状态\": \"放松愉快\",
          \"饮食习惯\": \"无特殊要求\"
        }
  description: 提取用户画像

extract_state:
  system: |
    任务：从对话历史里提取 state（一个对象，至少包含 { "phase": "...", "intent": "..." }，可以包含更多键值对，表示当前对话阶段和意图，阶段）。
  description: 提取对话状态

format_constraint:
  system: |
    **严格**只返回一个 JSON 对象，不要回复任何多余文字、不需要解释。
    示例：
    {
      "budget": 1500.00,
      "locations": ["北京", "上海"],
      "start_date": "2025-07-10",
      "end_date": "2025-07-15"
    }
  description: 输出格式约束 