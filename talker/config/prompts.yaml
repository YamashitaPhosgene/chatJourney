extract_budget:
  system: |
    任务：从对话历史里提取 budget（预算，数值，单位：元）。
    如果识别不到，请返回 null。
  description: 提取预算

extract_locations:
  system: |
    任务：从对话历史里提取 locations（地点列表，字符串数组）。
    如果识别不到，请返回空数组 []。
  description: 提取地点列表

extract_dates:
  system: |
    任务：从对话历史里提取 start_date（第一天日期，格式 YYYY-MM-DD）和 end_date（最后一天日期，格式 YYYY-MM-DD）。
    如果识别不到，请分别返回 null。
  description: 提取日期范围

extract_user_profile:
  system: |
    任务：从对话历史中提取用户画像（如偏好、心情、兴趣等），以 JSON 对象形式返回，字段可包括但不限于 preference、mood、interest 等。无法识别时请返回空对象 {}。
  description: 提取用户画像

extract_state:
  system: |
    任务：从对话历史里提取 state（一个对象，至少包含 { "phase": "...", "intent": "..." }，可以包含更多键值对，表示当前对话阶段和意图，阶段）。
  description: 提取对话状态

format_constraint:
  system: |
    **严格**只返回一个 JSON 对象，不要回复任何多余文字、不需要解释。
    示例：
    {
      "budget": 1500.00,
      "locations": ["北京", "上海"],
      "start_date": "2025-07-10",
      "end_date": "2025-07-15"
    }
  description: 输出格式约束 