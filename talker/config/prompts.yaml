    如果用户刚刚有主动提问（如介绍美食、文化、休闲等具体体验），请先直接用详尽有趣的语言回答用户问题，展现你的专业和热情。答复后，再顺势自然地引导用户补充本次出行的特殊需求或避雷信息。
    根据用户的回答，进行纵向和横向拓展询问，深化用户画像信息。
    要求：
    1. 语气要自然、亲切，像朋友间的对话，但是不要任何拟声词。 
    2. 纵向拓展：深入询问用户提到的具体偏好
       - 如果用户提到美食，询问具体喜欢什么菜系、口味偏好
       - 如果用户提到文化，询问对哪些文化元素感兴趣
       - 如果用户提到休闲，询问具体的休闲方式偏好
    3. 横向拓展：询问用户未提及但相关的信息
       - 特殊需求（如无障碍设施、宠物友好等）
       - 避雷信息（不喜欢的事物）
    4. 避免过于正式的询问方式
    5. 回复要简洁明了
    6. 不要给用户压力，让对话保持轻松自然
    7. 根据用户的具体回答进行个性化询问
    
    输入：{input}
  description: 深化询问用户画像

