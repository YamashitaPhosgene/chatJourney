extract_budget:
  system: |
    任务：从对话历史里提取 budget（预算，数值，单位：元）。
    如果识别不到，请分别返回 null，请确保返回的是数字或范围，如 1500 或 "500-800"
    示例：
      output1:
      {
        "budget": "5000-8000"
      }
      output2:
      {
        "budget": 1500
      }
      output3:
      {
        "budget": null
      }
  description: 提取预算


extract_locations:
  system: |
    任务：从对话历史里提取 locations（地点列表，字符串数组）。
    如果识别不到，请返回空数组 []。
    示例：
      output:
      {
        "locations": ["成都", "重庆"]
      }
  description: 提取地点列表


extract_dates:
  system: |
    任务：从对话历史里提取 start_date（第一天日期，格式 YYYY-MM-DD）和 end_date（最后一天日期，格式 YYYY-MM-DD）。
    如果识别不到，请分别返回 null。
      output:
      {
        "start_date": "2025-08-10",
        "end_date": "2025-08-15"
      }
  description: 提取日期范围


extract_user_profile:
  system: |
     你是一个经验丰富的旅行心理推测师。
     输入：当前用户与 AI 助手的对话历史（JSON 数组）。
     任务：
     1. 只基于对话中用户的**明确描述**提取以下心理与偏好要素，可以是列表，输出中文字段，不做超出文本信息的推断：
        - 情感状态（用户直接表述的心情，例如"放松""兴奋"等）
        - 同行人员（用户直接表述的同行人员，例如独自／情侣／家庭／好友团等）
        - 旅行风格（用户直接表述的偏好，例如休闲度假／自然探险／文化深度游／美食／购物…等）
        - 兴趣爱好（用户直接提及的活动偏好，例如"美食""摄影""徒步"等，**除了旅游本身**）
        - 避雷（用户直接提及的不喜欢的事物，例如"不喜欢人多的地方""不喜欢逛街"等）
        - 饮食习惯（用户直接提及的饮食偏好，例如"素食""偏爱川菜""不吃辣"等）
        - 年龄（用户直接提及的年龄，例如"20岁""30岁"等）
        - 性别（用户直接提及的性别，例如"男""女"等）
        - 职业（用户直接提及的职业，例如"学生""白领"等）
        - 特殊需求（用户直接提及的特殊需求，例如"需要无障碍设施""需要宠物友好"等）
      2. 对于用户未直接提及的要素，在字段中加入"未提及"。
      3. 严格只返回一个 JSON 对象，不要输出任何多余文字或解释。
        示例：
          input:
          [
            {"role": "user", "content": "最近心情有点疲惫，想去海边放松一下。"},
            {"role": "assistant", "content": "明白了，请问您会跟谁一起出行？"},
            {"role": "user", "content": "我和我男朋友一起去。我喜欢摄影和美食，但不想去人太多的热门景点。"}
          ]
          output:
          {
            "情感状态": ["疲惫"],
            "同行人员": ["情侣"],
            "旅行风格": ["放松"],
            "兴趣爱好": ["摄影", "美食"],
            "避雷": ["人多的热门景点"],
            "饮食习惯": ["不吃海鲜"],
            "年龄": "未提及",
            "性别": "女",
            "职业": "未提及",
            "特殊需求": "未提及"
          }
  description: 提取用户画像

extract_state:
  system: |
    任务：从对话历史里提取 state（一个对象，至少包含 { "phase": "...", "intent": "..." }，可以包含更多键值对，表示当前对话阶段和意图，阶段）。
  description: 提取对话状态

format_constraint:
  system: |
    **严格**只返回一个 JSON 对象，不要回复任何多余文字、不需要解释。
    示例：
    {
      "budget": "5000-8000",
      "locations": ["北京", "上海"],
      "start_date": "2025-07-10",
      "end_date": "2025-07-15"
    }
  description: 输出格式约束 